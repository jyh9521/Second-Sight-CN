name: Offline validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: python -X utf8 -m unittest discover -s tests -v
      - run: python -X utf8 tools/check_docs.py
      - run: python -X utf8 tools/audit_coverage.py --locale-dir locales/zh-CN
      - run: python -X utf8 tools/inspect_renderer.py --self-test
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/build_runtime.ps1
      - run: python -X utf8 tools/make_host_fixture.py build/synthetic/locale-slp2.bin --format SLP2
      - run: python -X utf8 tools/make_host_fixture.py build/synthetic/locale-slp3.bin --format SLP3
      - run: python -X utf8 tools/make_host_fixture.py build/synthetic/locale-slp3-hd.bin --format SLP3 --atlas-size 1024
      - shell: pwsh
        run: |
          foreach ($format in @('slp2', 'slp3', 'slp3-hd')) {
            & .\build\runtime\localization_host.exe "$PWD\build\runtime\SecondSight.Localization.asi" "$PWD\build\synthetic\locale-$format.bin"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - shell: pwsh
        run: |
          & .\build\runtime\compatibility_host.exe "$PWD\build\runtime\SecondSight.Compatibility.asi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\build\runtime\gameplay_tweaks_host.exe "$PWD\build\runtime\SecondSight.GameplayTweaks.asi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  catalog-acceptance:
    name: Strict catalog gate (pending findings are failures)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -X utf8 tools/translation_checks.py --locale-dir locales/zh-CN
